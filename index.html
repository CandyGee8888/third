<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自習室預約系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --danger-light: #fee2e2;
            --success: #059669;
            --success-dark: #047857;
            --success-light: #d1fae5;
            --btn-main: #960B05;
            --btn-main-dark: #6b0400;
            --btn-main-light: #b8302a;
            --bg: #FFFEE5;
            --card-bg: #FFF3C4;
            --black: #1a1a1a;
            --gray-dark: #4a4a4a;
            --gray: #8b8b8b;
            --shadow-pixel: 4px 4px 0 rgba(0,0,0,0.15);
            --shadow-pixel-hover: 4px 4px 0 rgba(0,0,0,0.25);
            --shadow-pixel-active: 2px 2px 0 rgba(0,0,0,0.2);
            --radius: 0px;
            --font-pixel: 'Courier New', 'Consolas', monospace;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-pixel);
            background-color: var(--bg);
            background-image: radial-gradient(circle, #f0edd0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--black);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #960B05;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        h1::before {
            content: "📚";
            font-size: 2.4rem;
            color: #960B05;
            text-shadow: none;
        }

        /* 篩選器 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
            background: var(--card-bg);
            padding: 1.25rem 1.5rem;
            border: 3px solid var(--black);
            box-shadow: var(--shadow-pixel);
            border-radius: var(--radius);
            transition: box-shadow var(--transition-speed) ease;
        }

        .filter-bar:hover {
            box-shadow: var(--shadow-pixel-hover);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 0.2rem;
            font-family: var(--font-pixel);
        }

        .filter-btn {
            border: 2px solid var(--black);
            background: var(--bg);
            color: var(--black);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: var(--font-pixel);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            border-radius: var(--radius);
            position: relative;
        }

        .filter-btn.active {
            background: var(--btn-main-dark);
            color: white;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            transform: translate(1px, 1px);
        }

        .filter-btn:hover:not(.active) {
            background: var(--card-bg);
            transform: translate(-2px, -2px) scale(1.03);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.25);
        }

        .filter-btn:active {
            transform: translate(1px, 1px);
            box-shadow: var(--shadow-pixel-active);
        }

        /* 圖表容器 */
        .chart-container {
            background: var(--card-bg);
            border: 3px solid var(--black);
            box-shadow: var(--shadow-pixel);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: block;
            border-radius: var(--radius);
            transition: box-shadow var(--transition-speed) ease;
        }

        .chart-container:hover {
            box-shadow: var(--shadow-pixel-hover);
        }

        .chart-title {
            font-family: var(--font-pixel);
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            color: var(--black);
        }

        .chart-bar-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .chart-label {
            width: 80px;
            font-family: var(--font-pixel);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--black);
            margin-right: 0.5rem;
        }

        .chart-bar-bg {
            flex: 1;
            background: var(--bg);
            border: 2px solid var(--black);
            height: 24px;
            position: relative;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);
        }

        .chart-bar-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s ease, filter 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            border-right: 2px solid var(--black);
            cursor: pointer;
        }

        .chart-bar-fill:hover {
            filter: brightness(1.1);
            transform: scaleY(1.1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .chart-bar-fill.category-學校 { background: var(--primary); }
        .chart-bar-fill.category-功課 { background: #eab308; }
        .chart-bar-fill.category-生活 { background: #22c55e; }
        .chart-bar-fill.category-其他 { background: #a855f7; }

        .chart-value {
            margin-left: 0.5rem;
            font-family: var(--font-pixel);
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--black);
            min-width: 40px;
        }

        /* 搜尋框 */
        .search-box {
            width: 100%;
            margin-bottom: 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 3px solid var(--black);
            font-size: 0.95rem;
            background: var(--bg);
            transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            box-shadow: var(--shadow-pixel);
            font-family: var(--font-pixel);
            letter-spacing: 0.5px;
            border-radius: var(--radius);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 4px 4px 0 rgba(37,99,235,0.3);
        }

        .search-box input::placeholder {
            color: var(--gray);
            font-weight: 400;
        }

        /* 預約表單 */
        .booking-form {
            background: var(--card-bg);
            padding: 1.75rem;
            border: 3px solid var(--black);
            box-shadow: var(--shadow-pixel);
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: flex-end;
            border-radius: var(--radius);
            transition: box-shadow var(--transition-speed) ease;
        }

        .booking-form:hover {
            box-shadow: var(--shadow-pixel-hover);
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1 1 180px;
        }

        .form-field label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--black);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-pixel);
        }

        select, input[type="date"] {
            padding: 0.7rem 0.9rem;
            border: 2px solid var(--black);
            font-size: 0.95rem;
            background: var(--bg);
            transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease, background var(--transition-speed) ease;
            width: 100%;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
            font-family: var(--font-pixel);
            border-radius: var(--radius);
        }

        select:hover, input[type="date"]:hover {
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 4px 4px 0 rgba(37,99,235,0.2);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 4px 4px 0 rgba(37,99,235,0.4);
        }

        .submit-btn {
            background: var(--btn-main);
            color: white;
            font-weight: 700;
            border: 3px solid var(--black);
            padding: 0.7rem 2rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            white-space: nowrap;
            align-self: flex-end;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.25);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: var(--font-pixel);
            border-radius: var(--radius);
        }

        .submit-btn:hover {
            background: var(--btn-main-dark);
            transform: translate(-2px, -2px) scale(1.03);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
        }

        .submit-btn:active {
            transform: translate(1px, 1px);
            box-shadow: var(--shadow-pixel-active);
        }

        /* 訊息提示 */
        .message-box {
            padding: 0.9rem 1.2rem;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            font-weight: 700;
            display: none;
            background: var(--card-bg);
            border: 3px solid var(--black);
            box-shadow: var(--shadow-pixel);
            font-family: var(--font-pixel);
            border-radius: var(--radius);
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-box.error {
            background: #fee2e2;
            border-color: var(--danger);
            color: var(--danger-dark);
            display: block;
        }

        .message-box.success {
            background: #d1fae5;
            border-color: var(--success);
            color: var(--success-dark);
            display: block;
        }

        /* 列表 */
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .record-card {
            background: var(--card-bg);
            border: 3px solid var(--black);
            box-shadow: var(--shadow-pixel);
            padding: 1.1rem 1.4rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: all var(--transition-speed) ease;
            border-radius: var(--radius);
        }

        .record-card:hover {
            box-shadow: var(--shadow-pixel-hover);
            transform: translate(-2px, -2px) scale(1.01);
        }

        .record-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.5rem;
        }

        .record-field {
            font-size: 0.9rem;
            color: var(--black);
            font-family: var(--font-pixel);
        }

        .record-id {
            font-family: var(--font-pixel);
            background: var(--bg);
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--gray-dark);
            font-size: 0.8rem;
            color: var(--black);
            transition: background var(--transition-speed) ease;
        }

        .record-id:hover {
            background: var(--card-bg);
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--black);
            background: var(--bg);
            color: var(--black);
            transition: all var(--transition-speed) ease;
        }

        .badge:hover {
            filter: brightness(0.95);
            transform: scale(1.05);
        }

        .badge-active {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-color: var(--primary);
        }

        .badge-active:hover {
            background: #bfdbfe;
        }

        .badge-done {
            background: var(--success-light);
            color: var(--success-dark);
            border-color: var(--success);
        }

        .badge-done:hover {
            background: #a7f3d0;
        }

        .badge-expired {
            background: var(--danger-light);
            color: var(--danger-dark);
            border-color: var(--danger);
            text-decoration: line-through;
        }

        .badge-expired:hover {
            background: #fecaca;
        }

        .toggle-btn {
            background: var(--btn-main);
            color: white;
            border: 2px solid var(--black);
            padding: 0.45rem 1.2rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: var(--font-pixel);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            border-radius: var(--radius);
            transition: all var(--transition-speed) ease;
        }

        .toggle-btn:hover:not(:disabled) {
            background: var(--btn-main-dark);
            transform: translate(-2px, -2px) scale(1.05);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
        }

        .toggle-btn:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: var(--shadow-pixel-active);
        }

        .toggle-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: #aaa;
            color: #ddd;
            background: #5a5a5a;
            box-shadow: none;
            transform: none;
        }

        .empty-message {
            text-align: center;
            color: var(--gray-dark);
            padding: 3rem 2rem;
            font-style: italic;
            background: var(--card-bg);
            border: 3px dashed var(--black);
            box-shadow: var(--shadow-pixel);
            font-family: var(--font-pixel);
            transition: background var(--transition-speed) ease;
        }

        .empty-message:hover {
            background: #fff8d0;
        }

        /* 手機適配 */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.75rem;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 1.25rem;
            }
            .filter-bar {
                padding: 1rem;
                gap: 0.8rem;
                flex-direction: column;
            }
            .filter-group {
                width: 100%;
                justify-content: flex-start;
            }
            .booking-form {
                flex-direction: column;
                padding: 1.2rem;
                gap: 0.8rem;
            }
            .form-field {
                width: 100%;
                flex: auto;
            }
            .submit-btn {
                width: 100%;
                text-align: center;
                padding: 0.8rem;
                margin-top: 0.25rem;
            }
            .record-card {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem;
            }
            .record-info {
                width: 100%;
                gap: 0.5rem 1rem;
            }
            .toggle-btn {
                align-self: flex-end;
                margin-top: 0.25rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>自習室預約</h1>

    <!-- 篩選器 -->
    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-label">狀態</span>
            <button class="filter-btn active" data-filter="status" data-value="all">全部</button>
            <button class="filter-btn" data-filter="status" data-value="active">Active</button>
            <button class="filter-btn" data-filter="status" data-value="done">Done</button>
            <button class="filter-btn" data-filter="status" data-value="expired">Expired</button>
        </div>
        <div class="filter-group">
            <span class="filter-label">分類</span>
            <button class="filter-btn active" data-filter="category" data-value="all">全部</button>
            <button class="filter-btn" data-filter="category" data-value="學校">學校</button>
            <button class="filter-btn" data-filter="category" data-value="功課">功課</button>
            <button class="filter-btn" data-filter="category" data-value="生活">生活</button>
            <button class="filter-btn" data-filter="category" data-value="其他">其他</button>
        </div>
    </div>

    <!-- 圖表區塊 (資料視覺化) -->
    <div class="chart-container" id="chartContainer">
        <div class="chart-title">📊 預約分類統計</div>
        <div id="chartBars"></div>
    </div>

    <!-- 搜尋框 -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜尋預約編號、分類、日期或時段… 例：2026-05-28">
    </div>

    <!-- 預約表單 -->
    <div class="booking-form">
        <div class="form-field">
            <label for="dateInput">📅 預約日期</label>
            <input type="date" id="dateInput" required>
        </div>
        <div class="form-field">
            <label for="timeSelect">⏰ 時段</label>
            <select id="timeSelect"></select>
        </div>
        <div class="form-field">
            <label for="categorySelect">📂 分類</label>
            <select id="categorySelect">
                <option value="學校">學校</option>
                <option value="功課">功課</option>
                <option value="生活">生活</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <button class="submit-btn" id="submitBtn">➕ 新增預約</button>
    </div>

    <!-- 訊息區 -->
    <div id="messageBox" class="message-box"></div>

    <!-- 預約列表 -->
    <div id="recordList" class="record-list"></div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'records';
        const MAX_ACTIVE_PER_SLOT = 20;
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8opVPasZYFZ5F8sEeVke_XKevGv9TDKYjk-IVexhpBnevIj9vfPOTNHCKxEtq6U84/exec";
        const DEMO_DATE = '2026-05-28';

        const dateInput = document.getElementById('dateInput');
        const timeSelect = document.getElementById('timeSelect');
        const categorySelect = document.getElementById('categorySelect');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('messageBox');
        const recordListEl = document.getElementById('recordList');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const searchInput = document.getElementById('searchInput');
        const chartBarsEl = document.getElementById('chartBars');

        let currentStatusFilter = 'all';
        let currentCategoryFilter = 'all';
        let searchKeyword = '';

        // ---------- 工具函數 ----------
        function generateId() {
            return 'rec_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
        }

        function formatCreatedAt(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.className = 'message-box ' + type;
            if (type === 'success') {
                setTimeout(() => {
                    if (messageBox.textContent === text) {
                        messageBox.className = 'message-box';
                        messageBox.textContent = '';
                    }
                }, 4000);
            }
        }

        function clearMessage() {
            messageBox.className = 'message-box';
            messageBox.textContent = '';
        }

        // ---------- 本地儲存 (localStorage) ----------
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('讀取資料失敗', e);
                return [];
            }
        }

        function saveAllData(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // ---------- 雲端同步相關 ----------
        function normalizeRecord(sheetRecord) {
            return {
                id: sheetRecord.ID || sheetRecord.id || '',
                createdAt: sheetRecord.CreatedAt || sheetRecord.createdAt || '',
                status: sheetRecord.Status || sheetRecord.status || 'active',
                date: sheetRecord.Date || sheetRecord.date || '',
                time: sheetRecord.Time || sheetRecord.time || '',
                category: sheetRecord.Category || sheetRecord.category || ''
            };
        }

        async function fetchRecordsFromSheet() {
            const response = await fetch(APPS_SCRIPT_URL);
            if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
            const data = await response.json();
            if (!data.ok) throw new Error(data.error || 'Unknown server error');
            return (data.records || []).map(normalizeRecord);
        }

        function syncToSheet(payload) {
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (!data.ok) console.error('同步到 Sheet 失敗:', data.error);
            })
            .catch(err => console.error('同步請求錯誤:', err));
        }

        // ---------- 資料操作 ----------
        function saveData(record) {
            const records = loadData();
            records.push(record);
            saveAllData(records);
            syncToSheet({ action: "create", record: record });
        }

        function updateRecord(id, changes) {
            const records = loadData();
            const index = records.findIndex(r => r.id === id);
            if (index === -1) return null;
            records[index] = { ...records[index], ...changes };
            saveAllData(records);
            syncToSheet({ action: "update", id: id, changes: changes });
            return records[index];
        }

        function createRecord(formData) {
            return {
                id: generateId(),
                createdAt: new Date().toISOString(),
                status: 'active',
                time: formData.time,
                category: formData.category,
                date: formData.date
            };
        }

        function isSlotFull(date, time) {
            const records = loadData();
            const activeCount = records.filter(r =>
                r.date === date &&
                r.time === time &&
                r.status === 'active'
            ).length;
            return activeCount >= MAX_ACTIVE_PER_SLOT;
        }

        function expireOldRecords() {
            const records = loadData();
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            let changed = false;
            records.forEach(record => {
                if (record.status === 'active' && record.date < todayStr) {
                    record.status = 'expired';
                    changed = true;
                    syncToSheet({ action: "update", id: record.id, changes: { status: 'expired' } });
                }
            });
            if (changed) saveAllData(records);
        }

        function setDateRange() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            const maxDate = new Date(today);
            maxDate.setMonth(maxDate.getMonth() + 2);
            const maxY = maxDate.getFullYear();
            const maxM = String(maxDate.getMonth() + 1).padStart(2, '0');
            const maxD = String(maxDate.getDate()).padStart(2, '0');
            const maxStr = `${maxY}-${maxM}-${maxD}`;

            dateInput.min = todayStr;
            dateInput.max = maxStr;

            if (DEMO_DATE >= todayStr && DEMO_DATE <= maxStr) {
                dateInput.value = DEMO_DATE;
            } else {
                dateInput.value = todayStr;
            }
        }

        function generateTimeOptions() {
            timeSelect.innerHTML = '';
            for (let hour = 9; hour <= 22; hour++) {
                const start = `${hour}:00`;
                const end = `${hour + 1}:00`;
                const option = document.createElement('option');
                option.value = `${start}-${end}`;
                option.textContent = `${start} - ${end}`;
                timeSelect.appendChild(option);
            }
        }

        // ---------- 資料視覺化：純 CSS 長條圖 ----------
        function renderChart() {
            const records = loadData();
            const categories = ['學校', '功課', '生活', '其他'];
            const counts = {};
            categories.forEach(cat => counts[cat] = 0);
            records.forEach(r => {
                if (categories.includes(r.category)) {
                    counts[r.category]++;
                }
            });

            const total = Object.values(counts).reduce((a,b)=>a+b, 0) || 1;
            let html = '';
            categories.forEach(cat => {
                const count = counts[cat];
                const percent = (count / total) * 100;
                html += `
                    <div class="chart-bar-wrapper">
                        <span class="chart-label">${cat}</span>
                        <div class="chart-bar-bg">
                            <div class="chart-bar-fill category-${cat}" style="width: ${percent}%"></div>
                        </div>
                        <span class="chart-value">${count}</span>
                    </div>
                `;
            });
            chartBarsEl.innerHTML = html;
        }

        // ---------- 渲染列表 ----------
        function renderList(recordsToShow) {
            recordListEl.innerHTML = '';
            if (!recordsToShow || recordsToShow.length === 0) {
                recordListEl.innerHTML = '<div class="empty-message">尚無預約記錄，新增一筆試試看！<br>日期格式如：2026-05-28</div>';
                return;
            }

            recordsToShow.forEach(record => {
                const card = document.createElement('div');
                card.className = 'record-card';
                let statusBadgeClass;
                if (record.status === 'active') statusBadgeClass = 'badge-active';
                else if (record.status === 'done') statusBadgeClass = 'badge-done';
                else if (record.status === 'expired') statusBadgeClass = 'badge-expired';
                else statusBadgeClass = '';

                const isExpired = record.status === 'expired';

                card.innerHTML = `
                    <div class="record-info">
                        <span class="record-field"><span class="record-id">${escapeHtml(record.id)}</span></span>
                        <span class="record-field"><strong>📂</strong> ${escapeHtml(record.category)}</span>
                        <span class="record-field"><strong>📅</strong> ${escapeHtml(record.date)}</span>
                        <span class="record-field"><strong>⏰</strong> ${escapeHtml(record.time)}</span>
                        <span class="record-field"><strong>🕒</strong> ${formatCreatedAt(record.createdAt)}</span>
                        <span class="badge ${statusBadgeClass}">${record.status}</span>
                    </div>
                    ${isExpired ? 
                        '<button class="toggle-btn" disabled>⏳ 已過期</button>' :
                        `<button class="toggle-btn" data-id="${escapeHtml(record.id)}" data-new-status="${record.status === 'active' ? 'done' : 'active'}">
                            ${record.status === 'active' ? '✔ 標記完成' : '↩ 恢復 Active'}
                        </button>`
                    }
                `;
                recordListEl.appendChild(card);
            });

            document.querySelectorAll('.toggle-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const id = this.dataset.id;
                    const newStatus = this.dataset.newStatus;
                    const updated = updateRecord(id, { status: newStatus });
                    if (updated) {
                        applyFiltersAndRender();
                        showMessage(`預約 ${id.slice(-6)} 已${newStatus === 'done' ? '標記完成' : '恢復為 active'}`, 'success');
                    } else {
                        showMessage('更新失敗，記錄可能不存在', 'error');
                    }
                });
            });
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function applyFiltersAndRender() {
            expireOldRecords();
            const allRecords = loadData();
            let filtered = allRecords;

            if (currentStatusFilter !== 'all') {
                filtered = filtered.filter(r => r.status === currentStatusFilter);
            }
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(r => r.category === currentCategoryFilter);
            }
            if (searchKeyword.trim() !== '') {
                const keyword = searchKeyword.trim().toLowerCase();
                filtered = filtered.filter(r => {
                    return r.id.toLowerCase().includes(keyword) ||
                        r.category.toLowerCase().includes(keyword) ||
                        r.date.includes(keyword) ||
                        r.time.includes(keyword);
                });
            }

            filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            renderList(filtered);
            renderChart();
        }

        // ---------- 新增預約流程 ----------
        function handleSubmit() {
            clearMessage();
            const date = dateInput.value;
            const time = timeSelect.value;
            const category = categorySelect.value;

            if (!date) { showMessage('請選擇預約日期', 'error'); return; }
            if (!time) { showMessage('請選擇時段', 'error'); return; }
            if (isSlotFull(date, time)) {
                showMessage(`⚠️ ${date} ${time} 此時段已滿人 (超過 ${MAX_ACTIVE_PER_SLOT} 人預約)，請選擇其他時段`, 'error');
                return;
            }

            const newRecord = createRecord({ date, time, category });
            saveData(newRecord);
            categorySelect.value = '學校';
            showMessage(`✅ 預約成功！您的預約 ID 為：${newRecord.id}`, 'success');
            applyFiltersAndRender();
        }

        // ---------- 篩選器互動 ----------
        function initFilterButtons() {
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const filterType = this.dataset.filter;
                    const filterValue = this.dataset.value;
                    document.querySelectorAll(`.filter-btn[data-filter="${filterType}"]`).forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (filterType === 'status') currentStatusFilter = filterValue;
                    else if (filterType === 'category') currentCategoryFilter = filterValue;
                    applyFiltersAndRender();
                });
            });
        }

        function initSearch() {
            searchInput.addEventListener('input', function(e) {
                searchKeyword = e.target.value;
                applyFiltersAndRender();
            });
        }

        // ---------- 初始化 ----------
        async function init() {
            setDateRange();
            generateTimeOptions();
            initFilterButtons();
            initSearch();
            submitBtn.addEventListener('click', handleSubmit);

            try {
                const sheetRecords = await fetchRecordsFromSheet();
                saveAllData(sheetRecords);
                showMessage('✅ 已從雲端載入最新預約資料', 'success');
            } catch (error) {
                console.warn('無法從 Google Sheet 載入，使用本地離線資料', error);
                showMessage('⚠️ 無法連線至雲端，使用本地離線資料', 'error');
            }

            expireOldRecords();
            applyFiltersAndRender();
        }

        init();
    })();
</script>
</body>
</html>
